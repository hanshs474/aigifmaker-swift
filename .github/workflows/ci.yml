name: ci
on: [push, workflow_dispatch]
jobs:
  linux:
    runs-on: ubuntu-latest
    container: swift:5.10
    steps:
      - uses: actions/checkout@v4
      - run: AIGIFMAKER_SMOKE=1 swift test
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: AIGIFMAKER_SMOKE=1 swift test
